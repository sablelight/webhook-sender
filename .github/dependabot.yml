# Dependabot — tailored to the ecosystems actually present in this repo.
version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci:"

  # NuGet
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "dotnet"]
    commit-message:
      prefix: "deps(nuget):"
