name: .NET CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Test (.NET ${{ matrix.dotnet-version }})
    # WPF (net10.0-windows) only builds on a Windows runner.
    runs-on: windows-latest
    strategy:
      matrix:
        dotnet-version: ['10.0.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore
        run: dotnet restore WebhookSender/WebhookSender.csproj

      - name: Build
        run: dotnet build WebhookSender/WebhookSender.csproj --no-restore --configuration Release

      - name: Analyze (Roslyn)
        run: dotnet build WebhookSender/WebhookSender.csproj --no-restore --configuration Release -p:RunAnalyzers=true -p:TreatWarningsAsErrors=true

      # No test project in this repo — skip instead of failing on "no tests".
      - name: Test with coverage
        shell: bash
        run: |
          if grep -rl 'Microsoft.NET.Test.Sdk' --include='*.csproj' . >/dev/null; then
            dotnet test WebhookSender/WebhookSender.csproj --no-build --configuration Release \
              --collect:"XPlat Code Coverage" \
              --results-directory ./coverage \
              -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
          else
            echo "no test project — skipping"
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/**/coverage.cobertura.xml
          fail_ci_if_error: false

  build:
    name: Build & Publish
    # WPF (net10.0-windows) only builds on a Windows runner.
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore WebhookSender/WebhookSender.csproj

      # WPF is Windows-only, so only the Windows RID can be published.
      - name: Publish (self-contained, trimmed)
        shell: bash
        run: |
          dotnet publish WebhookSender/WebhookSender.csproj -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:PublishTrimmed=true \
            -o ./publish/win-x64

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: publish
          path: publish/
          retention-days: 7

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: hashFiles('Dockerfile') != ''
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: hashFiles('Dockerfile') != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max